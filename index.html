<!DOCTYPE html>
<html lang="ru">
<head>

      window.dataLayer = window.dataLayer || [];

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Волчонок бот — Discord Bot</title>
    
    <meta name="keywords" content="Nexor бот Дискорд, Nexor бот, Nexor бот, Nexor, дискорд бот nexor, bot Nexor, Nexor дискорд">
    <meta name="description" content="Официальный сайт Discord бота Волчонок.">
    <meta name="author" content="Leo">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0f1e;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Размытый фон из аватарки */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('avatar.png') no-repeat center center/cover;
            filter: blur(8px) brightness(0.3);
            z-index: -1;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            animation: fadeIn 1s ease-in-out;
        }

        .avatar-container {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #5865F2, #7289da, #00d2ff);
            box-shadow: 0 0 25px rgba(88, 101, 242, 0.6);
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        p {
            font-size: 1rem;
            color: #b9bbbe;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .btn-invite {
            display: inline-block;
            width: 100%;
            padding: 16px 24px;
            background: linear-gradient(135deg, #5865F2, #4752C4);
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(88, 101, 242, 0.4);
            transition: all 0.3s ease;
        }

        .btn-invite:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(88, 101, 242, 0.6);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar-container">
            <img src="avatar.jpg" alt="Волчонок бот">
        </div>
        <h1>Волчонок бот</h1>
        <p>Многофункциональный Discord бот для модерации и управления вашим сервером.</p>
        <a href="https://discord.com/oauth2/authorize?client_id=1538922007125823539&permissions=8&integration_type=0&scope=applications.commands+bot" 
           target="_blank" 
           class="btn-invite">
            Пригласить на сервер
        </a>
    </div>

</body>
</html>
